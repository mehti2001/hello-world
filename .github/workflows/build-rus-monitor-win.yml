name: Build RUSMonitor Windows EXE

on:
  push:
    branches:
      - codex/rus-monitor-win-build
    paths-ignore:
      - artifacts/**
      - .github/workflows/build-rus-monitor-win.yml

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Unpack source bundle
        run: |
          python build_assets/unpack_source.py

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name RUSMonitor --paths src run_rus_monitor.py

      - name: Publish EXE to branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item dist\RUSMonitor.exe artifacts\RUSMonitor.exe -Force
          @"
          built_at=$([DateTime]::UtcNow.ToString("o"))
          python_version=$(python --version)
          runner=$env:RUNNER_OS
          "@ | Set-Content artifacts\build-info.txt -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/RUSMonitor.exe artifacts/build-info.txt
          git commit -m "Add built Windows executable" || exit 0
          git push
